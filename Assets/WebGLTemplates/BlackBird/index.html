<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0d1218">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #efe6d1; --gold: #c9a46a; --bg: #0d1218; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: var(--bg); outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: var(--ink); font-family: 'IM Fell English', Georgia, serif; text-align: center; padding: 16px;
      background: radial-gradient(ellipse at 50% 38%, rgba(255,180,100,0.16), transparent 42%), linear-gradient(#141b24, #0b0f14);
      transition: opacity 0.8s; }
    #loader h1 { font-family: 'IM Fell English SC', Georgia, serif; font-weight: 400; font-size: clamp(28px, 6vw, 56px); margin: 0 0 4px; letter-spacing: 0.04em; }
    #loader p { margin: 0 0 28px; opacity: 0.7; font-size: clamp(14px, 2.4vw, 20px); font-style: italic; }
    #bar { width: min(60vw, 420px); height: 2px; background: rgba(239,230,209,0.15); }
    #fill { height: 100%; width: 0; background: var(--gold); box-shadow: 0 0 10px var(--gold); transition: width 0.2s; }
    #msg { margin-top: 14px; font-size: 14px; opacity: 0.6; min-height: 1.2em; }
    #rotate { display: none; position: fixed; inset: 0; background: var(--bg); color: var(--ink); z-index: 10;
      font-family: 'IM Fell English', Georgia, serif; font-size: 22px; align-items: center; justify-content: center; text-align: center; padding: 16px; }
    @media (orientation: portrait) and (max-width: 900px) { #rotate { display: flex; } }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <h1>The Black Bird</h1>
    <p>San Francisco, 1895 · Burritt Alley</p>
    <div id="bar"><div id="fill"></div></div>
    <div id="msg">Lighting the gas lamps…</div>
  </div>
  <div id="rotate">Turn your phone sideways.</div>
  <script>
    const canvas = document.querySelector('#unity-canvas');
    const fill = document.querySelector('#fill');
    const loader = document.querySelector('#loader');
    const msg = document.querySelector('#msg');
    // render at device resolution, capped so phones keep their frame rate
    const dpr = Math.min(window.devicePixelRatio || 1, /iPhone|iPad|Android/i.test(navigator.userAgent) ? 2 : 1.5);
    const config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: "Build/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: dpr,
      showBanner: (text, type) => { if (type === 'error') msg.textContent = text; console.log(text); },
    };
    const script = document.createElement('script');
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = () => {
      createUnityInstance(canvas, config, p => { fill.style.width = (100 * p) + '%'; if (p > 0.9) msg.textContent = 'The fog is coming in…'; })
        .then(() => { loader.style.opacity = 0; setTimeout(() => loader.remove(), 900); canvas.focus(); })
        .catch(e => { msg.textContent = 'Could not start: ' + e; });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
